function recv(id,mm){const p=S.ship.find(x=>x.id==id),b=BB(p.b),d=S.days[b.id][13];if(mm){const q=+$('#mq').value;if(!(q>0))return toast('مقدار تقریبی را وارد کنید');p.st='mismatch';p.real=q;d.deliv+=q;aud('نانوا','مغایرت محموله '+id+($('#mn').value?' ('+$('#mn').value+')':''),b.id,F(p.kg),F(q))}else{p.st='received';d.deliv+=p.kg;aud('نانوا','تأیید دریافت '+id,b.id,'در مسیر','تحویل‌شده')}UI.mm=null;save();toast('ثبت شد');render()}
function pos(n){const b=me();for(let i=0;i<n;i++){const k=KS[Math.floor(Math.random()*4)],q=1+R2(Math.random()*8);if(S.offl){const x=T(b,Date.now()+i,k,q,'FP'+R2(Math.random()*900),{off:1,sy:'Q'});S.tx.pop();(S.off[b.id]=S.off[b.id]||[]).push(x)}else{sale(b,k,q);S.days[b.id][13].used+=q*BR[k][1]*1.03}}save();render()}
function tgo(){const b=me();if(S.offl){S.offl=0;const q=S.off[b.id]||[],sy='SY'+Date.now();q.forEach(x=>{x.sy=sy;x.h=hs(x.id+x.t+x.amt+x.k+x.q+x.fp);S.tx.push(x);const d=S.days[b.id][13];d.sold+=x.q;d.bf+=x.q*BR[x.k][1];d.rev+=x.amt;d.used+=x.q*BR[x.k][1]*1.03});S.off[b.id]=[];toast(F(q.length)+' تراکنش همگام شد')}else{S.offl=1;toast('حالت آفلاین')}save();render()}
function corr(id){const o=S.tx.find(x=>x.id==id),b=BB(o.b);T(b,Date.now(),o.k,-o.q,o.fp,{ref:id,st:'corr'});const d=S.days[b.id][13];d.sold-=o.q;d.bf-=o.q*BR[o.k][1];d.rev-=o.amt;aud('نانوا','اصلاحیهٔ '+id,b.id,F(o.q),'0');save();render()}
function cor(){const v=+$('#ck').value;if(!(v>=0)||$('#ck').value==='')return toast('عدد را وارد کنید');S.cor.push({b:S.me,v,t:Date.now()});aud('نانوا','درخواست اصلاح موجودی',S.me,F(inv(me())),F(v));save();toast('درخواست ثبت شد');render()}
function cmp(){S.cm.push({id:'C'+S.n++,b:S.me,k:$('#cb').value,type:$('#ct').value,score:+$('#cs').value,t:Date.now(),rp:'R'+R2(Math.random()*4)});save();toast('گزارش ثبت شد');render()}
function addIns(id){const g=+$('#ig').value;if(!(g>0))return toast('وزن را وارد کنید');S.ins.push({id:'I'+S.n++,b:id,t:Date.now(),k:$('#ik').value,ws:[g],res:'ok'});aud('بازرس','ثبت وزن‌کشی',id,'-',F(g)+'گ');save();toast('ثبت شد');render()}
function dec(id){aud('مدیر','تصمیم: '+$('#dc').value,id,F(rk(BB(id)).score),F(rk(BB(id)).score));save();toast('تصمیم در دفتر ممیزی ثبت شد');render()}
function scn(t){const b=me(),R=(()=>{let r=Date.now()%1e6+1;return()=>Math.abs(r=Math.imul(r,48271)%2147483647)/2147483647})();gen(b,'h',R);S.scn={b:b.id,steps:[]};const d=S.days[b.id],H=h=>new Date(Date.now()-DAY).setHours(h,0,0,0),mk=(l)=>()=>{save();const r=rk(b);S.scn.steps.push({l,r:r.score,c:r.lvl[1]});render()},ml=m=>{d.slice(-7).forEach(x=>x.used=x.bf*(1+m))};
 const P={h:[[0,'وضعیت پایه: رفتار طبیعی']],m:[[0,'وضعیت پایه'],[()=>ml(.2),'مصرف ۲۰٪ بالاتر از فروش'],[()=>{ml(.35);S.cm.push({id:'C'+S.n++,b:b.id,k:b.type,type:'وزن کم',score:1,t:Date.now(),rp:'R7'},{id:'C'+S.n++,b:b.id,k:b.type,type:'وزن کم',score:2,t:Date.now(),rp:'R8'},{id:'C'+S.n++,b:b.id,k:b.type,type:'کیفیت پایین',score:1,t:Date.now(),rp:'R9'})},'مغایرت ۳۵٪ + شکایت‌ها'],[()=>{ml(.5);S.ins.push({id:'I'+S.n++,b:b.id,t:Date.now(),k:b.type,ws:[1,2,3].map(()=>R2(BR[b.type][2]*.88)),res:'ok'})},'مغایرت ۵۰٪ + وزن پایین بازرسی'],[()=>{for(let j=0;j<6;j++)T(b,H(15)+j*2e4,'taftoon',10,'FPQ');ml(.55)},'تراکنش‌های تکراری هم‌زمان']],
 f:[[0,'وضعیت پایه'],[()=>{for(let j=0;j<8;j++)T(b,H(13)+j*8e2,'sangak',60,'FPY')},'هجوم تراکنش در چند ثانیه'],[()=>{for(let j=0;j<6;j++)T(b,H(15)+j*2e4,'taftoon',10,'FPZ')},'کارت و مبلغ تکراری'],[()=>{for(let j=0;j<10;j++)T(b,H(1+j*.1),'lavash',5,'FP'+j)},'تراکنش نیمه‌شب'],[()=>{for(let j=0;j<50;j++)T(b,H(20)+j*5e3,'lavash',2,'FQ'+j,{off:1,sy:'SYX'});d[13].sold*=3.2},'همگام‌سازی انبوه آفلاین + جهش فروش']]}[t];
 P.forEach(([fn,l],i)=>setTimeout(()=>{if(fn)fn();mk(l)()},i*1000+50));aud('دمو','سناریو '+t,b.id,'-','-');save();render()}
function render(keep){S.role=S.role||'baker';$('#th').textContent=TH=='dark'?'☀ روشن':'☾ تیره';$('#nb').textContent='اعلان‌ها · '+F(nt().length);const nv=N[S.role],on=UI.tab=='file'?'list':UI.tab;if(!nv.some(n=>n[0]==UI.tab)&&!['file','notif'].includes(UI.tab))UI.tab=nv[0][0];
 const tv=S.tx.every(x=>x.h==hs(x.id+x.t+x.amt+x.k+x.q+x.fp));$('#st').innerHTML=tg(tv?'دفتر سالم':'دستکاری',tv?'#2e9f74':'#d64550')+(S.offl?tg('آفلاین','#e0662c'):'');
 $('#rs').innerHTML=Object.keys(RN).map(r=>`<option value="${r}" ${r==S.role?'selected':''}>${RN[r]}</option>`).join('');$('#rs').onchange=e=>{S.role=e.target.value;UI.tab=N[S.role][0][0];save();render()};
 const bs=$('#bs');bs.classList.toggle('hidden',S.role!='baker');bs.innerHTML=S.bk.map(b=>`<option value="${b.id}" ${b.id==S.me?'selected':''}>${b.name} · ${b.city}</option>`).join('');bs.onchange=e=>{S.me=e.target.value;S.offl=0;save();render()};
 const L=nv.map(([k,n,i])=>`<button class="nv ${k==on?'on':''}" onclick="go('${k}')">${ic(i)}<span>${n}</span></button>`).join('');$('#bn').innerHTML=L;$('#sb').innerHTML=`<div class="flex items-center gap-2 mb-4"><div class="w-9 h-9 rounded-xl grid place-items-center text-white font-extrabold" style="background:linear-gradient(135deg,#5d69ea,#f59f42);color:#fff">ن</div><div class="leading-4"><b>نان‌یار</b><div class="text-[11px] mu">سامانهٔ ملی آرد و نان</div></div></div>`+L;
 const a=$('#app');if(keep){const q=document.activeElement;a.innerHTML=V[UI.tab]();const n=a.querySelector('input');if(n){n.focus();n.setSelectionRange(99,99)}}else{a.className='p-4 pb-28 md:pb-8 max-w-5xl mx-auto space-y-4 v';a.innerHTML=V[UI.tab]()}}
let TH='light';try{TH=localStorage.nanyar_th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
const ap=()=>document.documentElement.setAttribute('data-theme',TH);ap();
function tth(){TH=TH=='dark'?'light':'dark';try{localStorage.nanyar_th=TH}catch(e){}ap();render()}
function nt(){const L=[];if(S.role=='baker'){const b=me(),r=rk(b);S.ship.filter(x=>x.b==b.id&&x.st=='transit').forEach(p=>L.push(['محموله جدید',p.id+' منتظر تأیید دریافت است','#4f5bd5']));if((S.off[b.id]||[]).length)L.push(['صف آفلاین',F(S.off[b.id].length)+' تراکنش منتظر همگام‌سازی','#e0662c']);if(r.score>40)L.push(['وضعیت عملکرد',r.hum,r.lvl[1]])}else S.bk.map(b=>({b,r:rk(b)})).filter(x=>x.r.score>60).sort((a,c)=>c.r.score-a.r.score).slice(0,6).forEach(x=>L.push([x.b.name+' · ریسک '+F(x.r.score),x.r.act+' '+x.r.sg.slice(0,2).map(s=>s.l).join('، '),x.r.lvl[1]]));return L}
V.notif=()=>'<div class="space-y-3">'+(nt().map(n=>`<div class="card p-4 flex gap-3"><i class="w-1.5 rounded-full" style="background:${n[2]}"></i><div><b>${n[0]}</b><div class="text-sm mu">${n[1]}</div></div></div>`).join('')||'<div class="card p-5 mu">اعلان جدیدی نیست.</div>')+'</div>';
function rec(b){const w=S.days[b.id].slice(-7),e=sm(w,'bf'),a=sm(w,'used'),m=Math.max(e,a),dv=(a-e)/a*100,t=S.set.tol,s=Math.abs(dv)<=t?['طبیعی','#2e9f74']:Math.abs(dv)<=t*2.5?['نیازمند پایش','#d69e1f']:['بررسی لازم است','#d64550'];
return`<div class="card p-5"><div class="flex justify-between mb-3"><b>تطبیق آرد با نان · ۷ روز</b>${tg(s[0],s[1])}</div>${[['آرد معادل نان فروخته‌شده',e,'#4f5bd5'],['آرد مصرف‌شده',a,s[1]]].map(x=>`<div class="mb-2"><div class="flex justify-between text-sm"><span>${x[0]}</span><b>${F(x[1])} کیلو</b></div>${bar(x[1]/m*100,x[2])}</div>`).join('')}<div class="text-xs mu">اختلاف ${F(dv)}٪ · تلورانس طبیعی ±${F(t)}٪ (ضایعات، دورریز، تفاوت وزن)</div></div>`}
function c7(b){const d=S.days[b.id].slice(-7),m=Math.max(...d.map(x=>x.sold));return`<div class="card p-5"><b>فروش ۷ روز اخیر</b><svg viewBox="0 0 280 100" class="w-full mt-2">${d.map((x,i)=>`<rect x="${i*40+6}" y="${90-x.sold/m*80}" width="28" height="${x.sold/m*80}" rx="8" fill="${i==6?'#4f5bd5':'#aab1f0'}"/>`).join('')}</svg></div>`}
function hrs(b){const h=Array(17).fill(0);S.tx.filter(x=>x.b==b.id&&x.st=='ok'&&x.t>Date.now()-3*DAY).forEach(x=>{const k=new Date(x.t).getHours()-6;if(k>=0&&k<17)h[k]+=x.q});const m=Math.max(...h,1);return`<div class="card p-4"><b>ساعت‌های اوج فروش</b><svg viewBox="0 0 340 90" class="w-full mt-2">${h.map((v,i)=>`<rect x="${i*20+2}" y="${80-v/m*70}" width="14" height="${v/m*70}" rx="5" fill="${v==m?'#f59f42':'#aab1f0'}"/>`).join('')}</svg><div class="text-xs mu">ساعت ۶ تا ۲۲ · برای برنامه‌ریزی تنور و نیروی کار</div></div>`}
function heat(A){const B=[['کم‌ریسک',0,20,'#2e9f74'],['طبیعی',21,40,'#6dbf8f'],['پایش',41,60,'#d69e1f'],['بررسی',61,80,'#e0662c'],['پرریسک',81,101,'#d64550']],c=B.map(x=>A.filter(a=>a.r.score>=x[1]&&a.r.score<=x[2]).length);
return`<div class="card p-4"><div class="font-bold mb-3">نقشهٔ حرارتی نانوایی‌ها</div><div class="flex h-3 rounded-full overflow-hidden mb-2">${B.map((x,i)=>`<div style="flex:${c[i]};background:${x[3]}"></div>`).join('')}</div><div class="flex flex-wrap gap-3 text-xs mu mb-3">${B.map((x,i)=>`<span><i class="inline-block w-2 h-2 rounded-full ml-1" style="background:${x[3]}"></i>${x[0]} ${F(c[i])}</span>`).join('')}</div><div class="grid grid-cols-5 md:grid-cols-10 gap-2">${A.map(a=>`<button title="${a.b.name}" onclick="go('file','${a.b.id}')" class="rounded-xl py-2 text-xs font-bold text-white" style="background:${a.r.lvl[1]}">${F(+a.b.id.slice(1))}</button>`).join('')}</div></div>`}
function peer(b,r){const A=S.bk.map(x=>({x,r:rk(x)})).sort((p,q)=>p.r.score-q.r.score),i=A.findIndex(a=>a.x.id==b.id)+1,av=A.reduce((s,a)=>s+sm(S.days[a.x.id].slice(-7),'sold'),0)/A.length,m=sm(S.days[b.id].slice(-7),'sold'),as=A.reduce((s,a)=>s+a.r.score,0)/A.length;
return`<div class="card p-4"><b>مقایسه با همتاها</b><div class="grid grid-cols-3 gap-3 mt-3 text-sm"><div><div class="text-xs mu">رتبه از ${F(A.length)} (۱ بهترین)</div><b class="text-lg">${F(i)}</b></div><div><div class="text-xs mu">فروش نسبت به میانگین</div><b class="text-lg">${F(m/av*100)}٪</b></div><div><div class="text-xs mu">امتیاز ریسک نسبت به میانگین</div><b class="text-lg">${F(r.score-as)}</b></div></div></div>`}
const BRF={'مغایرت مصرف آرد':'موجودی فیزیکی آرد و کیسه‌های باز را با سامانه بسنجید','فروش بدون مصرف آرد':'مصرف آرد و ثبت‌های فروش را کنار هم ببینید','جهش غیرعادی فروش':'علت افزایش فروش (مناسبت یا سفارش عمده) را بپرسید','تراکنش‌های تکراری':'کارت‌خوان و گزارش تراکنش‌های تکراری را ببینید','تراکنش‌های پشت‌سرهم':'کارت‌خوان و دستگاه ثبت را بررسی کنید','تراکنش در ساعات غیرعادی':'ساعت کاری واقعی نانوایی را مشاهده کنید','هجوم بعد از آفلاین':'سابقهٔ قطعی اینترنت را بررسی کنید','فراتر از ظرفیت ساعتی':'ظرفیت تنور و تعداد شاگرد را ببینید','شکایت مشتریان (وزن‌دهی‌شده)':'ده نان را وزن‌کشی و با مشتریان صحبت کنید','وزن پایین‌تر از استاندارد':'چند نان را وزن‌کشی کنید','قیمت خارج از مصوب':'تابلوی قیمت را با نرخ مصوب مقایسه کنید'};
function brief(r){return`<div class="card p-4"><b>راهنمای بازدید</b><div class="text-sm mt-2 space-y-1.5">${r.sg.map(s=>`<div>☐ ${BRF[s.l]||s.l}</div>`).join('')||'<div class="mu">بازدید ضروری نیست.</div>'}</div></div>`}
function sub(A){S.pay=S.pay||{};return`<div class="card p-4 overflow-x-auto"><div class="font-bold mb-1">پرداخت یارانه (پیشنهاد سیستم)</div><div class="text-xs mu mb-2">درصد واریز فوری از سطح عملکرد می‌آید و باقی پس از بررسی آزاد می‌شود. جریمهٔ خودکار وجود ندارد و تصمیم با شماست.</div><table><tr><th>نانوایی</th><th>یارانهٔ هفته (م.ریال)</th><th>واریز پیشنهادی</th><th>در انتظار بررسی</th><th></th></tr>${[...A].sort((a,c)=>c.r.score-a.r.score).slice(0,10).map(a=>{const t=sm(S.days[a.b.id].slice(-7),'deliv')*RATE/1e6,p=a.r.score<=40?100:a.r.score<=60?80:a.r.score<=80?50:30;return`<tr><td>${a.b.name}</td><td>${F(t)}</td><td>${F(t*p/100)} (${F(p)}٪)</td><td>${F(t-t*p/100)}</td><td>${S.pay[a.b.id]?tg('تأیید شد','#2e9f74'):`<button class="tg" style="color:#4f5bd5" onclick="pay('${a.b.id}',${p})">تأیید پرداخت</button>`}</td></tr>`}).join('')}</table></div>`}
function pay(id,p){S.pay[id]=Date.now();aud('مدیر','تأیید پرداخت '+p+'٪',id,'-',p+'٪');save();toast('تأیید ثبت شد');render()}
