<body>
<div class="app">
<aside class="sidebar" id="sb"><div class="brand"><div class="mark">🌾</div><div><b>آردیار</b><span>سامانه ملی رهگیری آرد و نان</span></div></div><div id="nav"></div></aside>
<div class="main"><header class="top"><button class="ib ham" onclick="document.getElementById('sb').classList.toggle('open')">☰</button><h2 id="pt"></h2>
<div class="sp"><span id="net" class="b"></span><button class="ib" onclick="T()" title="تیره/روشن">◐</button></div></header>
<main class="content"><div class="ph"><h1 id="h1"></h1><p id="hp"></p></div><div id="v"></div></main></div></div>
<div id="toast" class="fixed bottom-4 left-4 right-4 md:left-auto md:w-96 space-y-2" style="z-index:200"></div>
<script>
const $=s=>document.querySelector(s),KEY='ardyar_v1';
const fa=n=>Number(n).toLocaleString('fa-IR'),
 jd=t=>new Date(t).toLocaleString('fa-IR-u-ca-persian',{dateStyle:'short',timeStyle:'short'});
const TR={CREATED:'ALLOCATED',ALLOCATED:'IN_TRANSIT',IN_TRANSIT:'DELIVERED',DELIVERED:'RECEIVED',RECEIVED:'OPENED',OPENED:'CONSUMED'};
const FA={CREATED:'تولید',ALLOCATED:'تخصیص',IN_TRANSIT:'در حمل',DELIVERED:'تحویل',RECEIVED:'دریافت',OPENED:'باز شده',CONSUMED:'مصرف شده',BLOCKED:'مسدود',CANCELLED:'لغو'};
const SC={A:'عالی',B:'مغایرت جزئی',C:'تراکنش غیرعادی',D:'QR تکراری',E:'آفلاین مشکوک',F:'مغایرت موجودی',G:'شکایت‌های متعدد',H:'پرریسک'};
const W={FLOUR:22,SALES:18,QR:20,OFFLINE:15,STOCK:12,COMPLAINT:8,INSPECT:14};
let S;
function seed(){
 const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
 S={seq:100,t:0,rules:{flourWarn:15,flourCrit:30,spike:2.0,burst:100,ratio:0.11},
 bakeries:'ABCDEFGH'.split('').map((k,i)=>({id:`BAK-1405-${String(125+i).padStart(6,'0')}`,key:k,name:`نانوایی ${SC[k]}`,city:['کاشمر','مشهد','تبریز','اهواز'][i%4],cap:900,base:500,consumedKg:0,sold:0,stock:0,status:'ACTIVE',pend:0})),
 bags:[],sales:[],alerts:[],audit:[],complaints:[],inspections:[],violations:[]};
 const fac='FAC-1405-000014';
 for(let i=0;i<48;i++){const b=S.bakeries[i%8];S.bags.push({id:`BAG-1405-${String(18300+i).padStart(11,'0')}`,batch:'BAT-1405-000987',factory:fac,dest:b.id,kg:40,status:'CREATED',tl:[ev('تولید و صدور QR','کارخانه آرد',fac)]})}
 // seed history
 S.bags.forEach((g,i)=>{const n=i<24?rnd(4,6):0;let k=0;while(k<n&&TR[g.status]&&k<6){g.status=TR[g.status];g.tl.push(ev(FA[g.status],'مسیر',g.dest));k++;
 if(g.status==='RECEIVED')bk(g.dest).stock+=40;if(g.status==='CONSUMED'){bk(g.dest).stock-=40;bk(g.dest).consumedKg+=40}if(g.status==='OPENED'){}}});
 S.bakeries.forEach(b=>{b.sold=Math.round(b.consumedKg/0.11*(b.key==='B'?0.8:1)*(b.key==='F'?1:1));});
 bk(S.bakeries[0].id);S.bakeries[0].sold=Math.round(S.bakeries[0].consumedKg/0.11);
 S.bakeries.forEach(b=>{b.stock=Math.max(b.stock,0)});
 log('سیستم','SYSTEM','Seed','داده اولیه ایجاد شد');
 // scenario seeds
 alert_('D','QR',S.bakeries[3].id,'QR تکراری شناسایی شد','کیسه دوبار در دو ساعت اسکن شد',2);
 alert_('C','SALES',S.bakeries[2].id,'جهش فروش','فروش ۲.۷ برابر میانگین',2);
 alert_('E','OFFLINE',S.bakeries[4].id,'انباشت تراکنش آفلاین','۲۵۰ تراکنش در ۳۰ ثانیه',1);
 alert_('F','STOCK',S.bakeries[5].id,'مغایرت موجودی','سیستمی ۱۲۰kg، ثبت‌شده ۲۰kg',2);
 for(let i=0;i<4;i++)S.complaints.push({id:'CMP-1405-'+(145+i),bakery:S.bakeries[6].id,cat:'وزن کم',t:Date.now()-i*864e5,status:'OPEN'});
 alert_('G','COMPLAINT',S.bakeries[6].id,'خوشه شکایت','۴ شکایت وزن کم در ۴ روز',1);
 alert_('H','FLOUR',S.bakeries[7].id,'مغایرت آرد به نان','۳۴٪ بیش از آستانه بحرانی',3);
 alert_('H','STOCK',S.bakeries[7].id,'مغایرت موجودی','',2);save()}
function bk(id){return S.bakeries.find(b=>b.id===id)}
function ev(op,place,user){return{t:Date.now()+(S?++S.t:0),op,place,user}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)seed()}
function id(p){return `${p}-1405-${String(++S.seq).padStart(6,'0')}`}
function log(user,role,action,entity,old,nw,res='OK'){S.audit.unshift({t:Date.now(),user,role,action,entity,old:old||'',nw:nw||'',res})}
function alert_(k,type,bakery,title,why,sev){S.alerts.unshift({id:id('ALR'),type,bakery,title,why,sev,status:'OPEN',t:Date.now()});log('موتور','SYSTEM','Alert:'+type,bakery,'',title)}
function toast(m,k='ok'){const d=document.createElement('div');d.className='c';d.style.borderColor=k==='ok'?'#16a34a':k==='w'?'#d97706':'#dc2626';d.textContent=(k==='ok'?'✓ ':k==='w'?'⚠ ':'✕ ')+m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3500)}
// ---- engines
function flourMismatch(b){if(!b.consumedKg)return 0;const exp=b.sold*S.rules.ratio;return Math.round(Math.abs(b.consumedKg-exp)/b.consumedKg*100)}
function risk(b){const o=S.alerts.filter(a=>a.bakery===b.id&&a.status==='OPEN'),rs=[];
 const add=(l,v)=>{if(v>0)rs.push([l,Math.min(v,40)])};
 const cnt=t=>o.filter(a=>a.type===t).reduce((s,a)=>s+a.sev,0);
 const m=flourMismatch(b);if(m>S.rules.flourCrit)add('مغایرت مصرف آرد ('+fa(m)+'٪)',W.FLOUR+8);else if(m>S.rules.flourWarn)add('مغایرت مصرف آرد ('+fa(m)+'٪)',W.FLOUR-6);
 add('تراکنش غیرعادی',cnt('SALES')*9);add('ناهنجاری QR',cnt('QR')*10);add('آفلاین غیرعادی',cnt('OFFLINE')*8);add('اختلاف موجودی',cnt('STOCK')*6);add('شکایت',cnt('COMPLAINT')*5);
 add('تخلف تأییدشده',S.violations.filter(v=>v.bakery===b.id&&v.status==='CONFIRMED').length*W.INSPECT);
 const sc=Math.min(100,rs.reduce((s,r)=>s+r[1],0));return{sc,rs}}
function trust(b){const r=risk(b).sc;return r<10?'HIGH_TRUST':r<25?'TRUSTED':r<45?'STANDARD':r<70?'UNDER_REVIEW':'HIGH_RISK'}
function perf(b){return Math.max(0,100-risk(b).sc)}
const TF={HIGH_TRUST:'اعتماد بالا',TRUSTED:'مورد اعتماد',STANDARD:'استاندارد',UNDER_REVIEW:'تحت بررسی',HIGH_RISK:'پرریسک'};
const rc=s=>s>=70?'#dc2626':s>=45?'#ea580c':s>=25?'#d97706':'#16a34a';
// ---- chain operations (state-validated)
function op(bagId,bId,action){const g=S.bags.find(x=>x.id===bagId.trim()),b=bk(bId);
 if(!g){alert_('?','QR',bId,'QR جعلی/ناشناخته',bagId,3);log(b.name,'BAKERY_MANAGER','SCAN',bagId,'','شناسه نامعتبر','REJECT');save();toast('شناسه معتبر نیست','e');return false}
 if(g.status==='BLOCKED'||g.status==='CANCELLED'){log(b.name,'BAKERY_MANAGER',action,g.id,g.status,'','REJECT');toast('کیسه '+FA[g.status]+' است؛ عملیات مجاز نیست','e');save();return false}
 if(action!=='dispatch'&&g.dest!==bId){alert_('X','QR',bId,'کیسه نانوایی دیگر',g.id+' → '+bk(g.dest).name,3);log(b.name,'BAKERY_MANAGER',action,g.id,'','مقصد اشتباه','REJECT');save();toast('این کیسه برای این نانوایی تخصیص داده نشده است','e');return false}
 const nx=TR[g.status];
 if(!nx){alert_('D','QR',bId,'QR تکراری — تلاش روی کیسه تمام‌شده',g.id,3);log(b.name,'BAKERY_MANAGER',action,g.id,g.status,'','REJECT');save();toast('کیسه قبلاً مصرف شده؛ هشدار بحرانی','e');return false}
 const want={receive:'RECEIVED',open:'OPENED',consume:'CONSUMED'}[action];
 if(want&&nx!==want){log(b.name,'BAKERY_MANAGER',action,g.id,g.status,want,'REJECT');toast(`گذار ${FA[g.status]} ← ${FA[want]} مجاز نیست (مرحله بعد: ${FA[nx]})`,'e');save();return false}
 g.tl.push(ev(FA[nx],'نانوایی',b.name));
 if(nx==='RECEIVED')b.stock+=g.kg;if(nx==='CONSUMED'){b.stock-=g.kg;b.consumedKg+=g.kg;if(b.stock<0){b.stock=0;alert_('F','STOCK',bId,'موجودی منفی',g.id,3)}}
 log(b.name,'BAKERY_MANAGER',action,g.id,g.status,nx);g.status=nx;save();toast(g.id+' ← '+FA[nx]);return true}
function advance(g,steps){while(steps--&&TR[g.status]&&g.status!=='DELIVERED'){g.status=TR[g.status];g.tl.push(ev(FA[g.status],'مسیر','سیستم'));}}
function sale(bId,q,offline){const b=bk(bId);S.sales.push({id:id('TXN'),bakery:bId,q,t:Date.now(),off:!!offline});b.sold+=q;
 if(q>b.base*S.rules.spike){alert_('C','SALES',bId,'جهش غیرعادی فروش',`میانگین ${fa(b.base)}، امروز ${fa(q)}`,2)}
 if(offline&&q>0&&S.rules.burst&&offline>S.rules.burst)alert_('E','OFFLINE',bId,'انباشت تراکنش آفلاین',`${fa(offline)} تراکنش در ۳۰ ثانیه`,2);
 if(b.stock<=0&&q>200)alert_('F','STOCK',bId,'فروش بالا با موجودی ناکافی','',2);
